name: Fetch TGV stations

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch TGV stop areas
        env:
          SNCF_API_KEY: ${{ secrets.SNCF_API_KEY }}
        run: python fetch_stations.py
