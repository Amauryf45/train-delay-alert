name: Train delay monitor

on:
  #schedule:
  #  - cron: "0 8,12 * * *"  # 10h et 14h Paris
  workflow_dispatch:            # lancement manuel possible
  push:
    branches: [test-telegram]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: train-state-${{ github.run_id }}
          restore-keys: train-state-

      - name: Run monitor
        env:
          SNCF_API_KEY: ${{ secrets.SNCF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.ref == 'refs/heads/test-telegram' && 'true' || '' }}
        run: python monitor.py
